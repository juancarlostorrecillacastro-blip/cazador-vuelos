# Copia este archivo como "config.yaml" (sin ".example") y ajusta tus rutas,
# o mejor: usa el formulario web para no editar YAML a mano:
#   python -m flight_hunter.web
#
# Cada entrada de "routes" es una busqueda independiente que el programa vigilara.
# departure_month / return_month usan formato "YYYY-MM": busca el precio mas
# barato en TODO ese mes, no en un dia exacto. Omite return_month para buscar
# solo ida.

routes:
  - origin: MAD              # Codigo IATA del aeropuerto de origen (3 letras)
    destination: BCN         # Codigo IATA del destino
    max_price: 40            # Avisar solo si el precio es igual o menor (en la moneda de abajo)
    currency: EUR
    departure_month: "2026-11"
    return_month: "2026-11"  # opcional: si se omite, busca solo ida

  - origin: MAD
    destination: LIS
    max_price: 60
    currency: EUR
    departure_month: "2026-11"
    return_month: "2026-11"

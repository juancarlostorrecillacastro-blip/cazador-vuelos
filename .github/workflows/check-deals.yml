name: Buscar ofertas de vuelos

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  check-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperar historico de precios de ejecuciones anteriores
        uses: actions/cache/restore@v4
        with:
          path: deals.db
          key: deals-db-v2-${{ github.run_id }}
          restore-keys: |
            deals-db-v2-

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Ejecutar el cazador de vuelos
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m flight_hunter.main

      - name: Guardar historico de precios para la proxima ejecucion
        if: always()
        uses: actions/cache/save@v4
        with:
          path: deals.db
          key: deals-db-v2-${{ github.run_id }}
